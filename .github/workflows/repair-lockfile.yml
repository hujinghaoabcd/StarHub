name: Repair dependency lockfile

on:
  push:
    branches:
      - agent/dependency-security-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-dependency-lockfile-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out dependency branch
        uses: actions/checkout@v6
        with:
          ref: agent/dependency-security-hardening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile from a clean installation
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Verify reproducible clean installation
        shell: bash
        run: |
          rm -rf node_modules
          npm ci

      - name: Run complete project checks
        run: npm run check

      - name: Commit repaired lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already consistent."
            exit 0
          fi
          git commit -m "chore: regenerate dependency lockfile"
          git push origin HEAD:agent/dependency-security-hardening
