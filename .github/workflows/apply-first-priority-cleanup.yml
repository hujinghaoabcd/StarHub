name: Apply first priority cleanup

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-priority-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.head_ref == 'agent/first-priority-cleanup' || github.ref == 'refs/heads/agent/first-priority-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: agent/first-priority-cleanup
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply exact cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceRequired(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            if (!source.includes(before)) {
              throw new Error(`Expected source not found in ${path}: ${before}`)
            }
            fs.writeFileSync(path, source.replace(before, after))
          }

          const globalStylesPath = 'src/styles/main.scss'
          const globalStyles = fs.readFileSync(globalStylesPath, 'utf8')
          const deepCount = (globalStyles.match(/:deep\(/g) || []).length
          if (deepCount === 0) {
            throw new Error('Expected global :deep() selectors were not found')
          }
          const normalizedStyles = globalStyles.replace(/:deep\(([^)]+)\)/g, '$1')
          if (normalizedStyles.includes(':deep(')) {
            throw new Error('Some global :deep() selectors could not be normalized')
          }
          fs.writeFileSync(globalStylesPath, normalizedStyles)
          console.log(`Normalized ${deepCount} global :deep() selectors`)

          replaceRequired(
            'src/layouts/HomeLayout.vue',
            'let loading = ElMessage({',
            'const loading = ElMessage({'
          )

          replaceRequired(
            'src/pages/Home/components/RepoCard.vue',
            `const emit = defineEmits<{\n  click: []\n  select: [selected: boolean]\n}>()`,
            `defineEmits<{\n  click: []\n  select: [selected: boolean]\n}>()`
          )

          replaceRequired(
            'src/pages/Home/components/SideMenu.vue',
            'let allCategoryMap = new Map<string, number[]>()',
            'const allCategoryMap = new Map<string, number[]>()'
          )
          replaceRequired(
            'src/pages/Home/components/SideMenu.vue',
            'const batchCategoryMap = await classifyRepositories(',
            'await classifyRepositories('
          )
          replaceRequired(
            'src/pages/Home/components/SideMenu.vue',
            'let existingTag = tagStore.tags.find((t: any) =>',
            'const existingTag = tagStore.tags.find((t: any) =>'
          )

          replaceRequired(
            'src/pages/Settings/index.vue',
            'let presets = categoryPresets.value',
            'const presets = categoryPresets.value'
          )

          replaceRequired(
            'src/types/element-plus.d.ts',
            'parse: (linkHeader: string) => ParsedLink',
            'parse: (_linkHeader: string) => ParsedLink'
          )

          const packagePath = 'package.json'
          const packageJson = fs.readFileSync(packagePath, 'utf8')
          const oldLint = 'eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore'
          const newLint = `${oldLint} --max-warnings=0`
          if (!packageJson.includes(oldLint)) {
            throw new Error('Expected lint script was not found')
          }
          fs.writeFileSync(packagePath, packageJson.replace(oldLint, newLint))
          NODE

      - name: Add global style regression test
        shell: bash
        run: |
          cat > tests/global-style-scope.test.mjs <<'EOF'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import test from 'node:test'

          test('global stylesheet does not use Vue SFC :deep selectors', async () => {
            const styles = await readFile(
              new URL('../src/styles/main.scss', import.meta.url),
              'utf8'
            )

            assert.equal(styles.includes(':deep('), false)
          })
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run complete checks
        run: npm run check

      - name: Remove one-time workflow
        run: rm -f .github/workflows/apply-first-priority-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete first priority cleanup"
          git push origin HEAD:agent/first-priority-cleanup
