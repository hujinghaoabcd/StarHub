name: Update production dependencies

on:
  push:
    branches:
      - agent/dependency-security-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-production-dependencies
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out dependency branch
        uses: actions/checkout@v6
        with:
          ref: agent/dependency-security-hardening
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade vulnerable direct production dependencies
        run: npm install --save axios@latest dompurify@latest

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Run complete project checks
        run: npm run check

      - name: Report production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const audit = JSON.parse(fs.readFileSync('audit-production.json', 'utf8'))
          const counts = audit.metadata?.vulnerabilities || {}
          const remaining = Object.entries(audit.vulnerabilities || {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            direct: Boolean(value.isDirect),
            range: value.range,
            fixAvailable: value.fixAvailable
          }))
          console.log(JSON.stringify({ counts, remaining }, null, 2))
          NODE

      - name: Commit dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update production dependencies"
          git push origin HEAD:agent/dependency-security-hardening
