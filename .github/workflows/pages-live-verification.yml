name: Verify Live GitHub Pages

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write

jobs:
  verify:
    name: Inspect main deployment and live site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: b406ede95eb3666bcf33d4b82bca576e112469f5
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&per_page=30" \
            --jq '.workflow_runs[] | {id, name, event, status, conclusion, head_branch, head_sha, html_url, created_at, updated_at}'

      - name: Verify Pages configuration and public content
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: b406ede95eb3666bcf33d4b82bca576e112469f5
        shell: bash
        run: |
          set -euo pipefail

          page_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
          base_url="${page_url%/}"
          curl_args=(--fail --silent --show-error --location --retry 18 --retry-all-errors --retry-delay 5)

          curl "${curl_args[@]}" "${base_url}/" --output application.html
          curl "${curl_args[@]}" "${base_url}/docs/" --output documentation.html
          curl "${curl_args[@]}" "${base_url}/deployment-info.json" --output deployment-info.json

          grep -q '<div id="app"></div>' application.html
          grep -Eq '/StarHub/assets/[^"[:space:]]+\.(js|css)' application.html
          grep -q 'StarHub' documentation.html
          grep -q '/StarHub/docs/assets/' documentation.html
          jq -e --arg sha "${MAIN_SHA}" \
            '.appBase == "/StarHub/" and .docsBase == "/StarHub/docs/" and .commit == $sha' \
            deployment-info.json

          application_asset="$(grep -oE '/StarHub/assets/[^"[:space:]]+\.(js|css)' application.html | head -n 1)"
          documentation_asset="$(grep -oE '/StarHub/docs/assets/[^"[:space:]]+\.(js|css)' documentation.html | head -n 1)"

          curl "${curl_args[@]}" "${base_url}${application_asset#/StarHub}" --output /dev/null
          curl "${curl_args[@]}" "${base_url}${documentation_asset#/StarHub}" --output /dev/null

          echo "Application URL: ${base_url}/"
          echo "Documentation URL: ${base_url}/docs/"
          echo "Application asset: ${application_asset}"
          echo "Documentation asset: ${documentation_asset}"
          echo "Verified deployed commit: ${MAIN_SHA}"
