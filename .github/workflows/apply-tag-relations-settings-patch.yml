name: Apply tag relation settings patch

on:
  push:
    branches:
      - agent/tag-relations-single-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-relations-settings-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tag-relations-single-source
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply Settings patch
        run: node scripts/apply-tag-relations-settings-patch.mjs

      - name: Commit generated Settings changes
        run: |
          if git diff --quiet -- src/pages/Settings/index.vue; then
            echo "No Settings changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Settings/index.vue
          git commit -m "refactor: persist tag relations through repoTags"
          git push origin HEAD:agent/tag-relations-single-source
