name: Diagnose OAuth Preparation

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect workflow runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=50")"
          echo "${runs}" | jq -r '.workflow_runs[] | [.id, .name, .event, .status, (.conclusion // "pending")] | @tsv'

          apply_run="$(echo "${runs}" | jq -r '.workflow_runs[] | select(.name == "Apply OAuth Backend Fix") | .id' | head -n 1)"
          if [[ -z "${apply_run}" ]]; then
            echo "Apply workflow run was not found."
            exit 1
          fi

          echo "Apply run: ${apply_run}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${apply_run}/jobs" \
            --jq '.jobs[] | {id, name, status, conclusion, steps: [.steps[] | {name, status, conclusion}]}'
