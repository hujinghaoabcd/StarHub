name: Apply OAuth Backend Fix

on:
  push:
    branches:
      - agent/fix-oauth-redirect-uri

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-oauth-redirect-uri
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply OAuth and Cloudflare changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + '\n', encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          scripts['cloudflare:build'] = 'node scripts/build-cloudflare.mjs'
          scripts['cloudflare:type-check'] = 'tsc -p functions/tsconfig.json --noEmit'
          scripts['cloudflare:dev'] = 'npm run cloudflare:build && npx wrangler pages dev cloudflare-dist'
          scripts['check'] = 'npm run lint && npm run type-check && npm run cloudflare:type-check && npm run pages:build && npm run cloudflare:build'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          write('scripts/build-cloudflare.mjs', r'''
          import { mkdir, rm, writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'

          const scriptDir = path.dirname(fileURLToPath(import.meta.url))
          const projectRoot = path.resolve(scriptDir, '..')
          const outputDirectory = path.join(projectRoot, 'cloudflare-dist')

          await rm(outputDirectory, { recursive: true, force: true })
          await mkdir(outputDirectory, { recursive: true })

          await writeFile(
            path.join(outputDirectory, 'index.html'),
            `<!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StarHub OAuth API</title>
            </head>
            <body>
              <main>
                <h1>StarHub OAuth API</h1>
                <p>该站点仅承载 StarHub 的 GitHub OAuth 服务端接口。</p>
                <p>健康检查：<a href="/api/health">/api/health</a></p>
              </main>
            </body>
          </html>
          `,
            'utf8'
          )

          await writeFile(
            path.join(outputDirectory, '_routes.json'),
            `${JSON.stringify({ version: 1, include: ['/api/*'], exclude: [] }, null, 2)}\n`,
            'utf8'
          )

          console.log('Cloudflare Pages output created in cloudflare-dist/')
          ''')

          write('functions/types.d.ts', r'''
          type PagesFunction<Env = unknown> = (context: {
            request: Request
            env: Env
            params: Record<string, string | string[]>
            data: unknown
            functionPath: string
            waitUntil(promise: Promise<unknown>): void
            next(input?: Request | string, init?: RequestInit): Promise<Response>
          }) => Response | Promise<Response>
          ''')

          write('functions/tsconfig.json', r'''
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "lib": ["ES2022", "WebWorker"],
              "strict": true,
              "noEmit": true,
              "skipLibCheck": true,
              "types": ["./types.d.ts"]
            },
            "include": ["./**/*.ts", "./types.d.ts"]
          }
          ''')

          write('functions/api/health.ts', r'''
          interface Env {
            CLIENT_ID?: string
            CLIENT_SECRET?: string
            ALLOWED_ORIGINS?: string
            GITHUB_REDIRECT_URI?: string
          }

          export const onRequestGet: PagesFunction<Env> = async ({ env }) => {
            return Response.json(
              {
                status: 'ok',
                service: 'starhub-oauth',
                configured: Boolean(
                  env.CLIENT_ID &&
                  env.CLIENT_SECRET &&
                  env.ALLOWED_ORIGINS &&
                  env.GITHUB_REDIRECT_URI
                )
              },
              {
                headers: {
                  'Cache-Control': 'no-store',
                  'X-Content-Type-Options': 'nosniff'
                }
              }
            )
          }
          ''')

          write('functions/api/oauth/token.ts', r'''
          interface Env {
            CLIENT_ID: string
            CLIENT_SECRET: string
            ALLOWED_ORIGINS: string
            GITHUB_REDIRECT_URI: string
          }

          interface TokenRequestBody {
            code?: unknown
            codeVerifier?: unknown
            redirectUri?: unknown
          }

          interface GitHubTokenResponse {
            access_token?: string
            token_type?: string
            scope?: string
            error?: string
            error_description?: string
          }

          function allowedOrigins(env: Env): Set<string> {
            return new Set(
              env.ALLOWED_ORIGINS.split(',')
                .map((origin) => origin.trim())
                .filter(Boolean)
            )
          }

          function getAllowedOrigin(request: Request, env: Env): string | null {
            const origin = request.headers.get('Origin')
            if (!origin || !allowedOrigins(env).has(origin)) {
              return null
            }
            return origin
          }

          function corsHeaders(origin: string): HeadersInit {
            return {
              'Access-Control-Allow-Origin': origin,
              'Access-Control-Allow-Methods': 'POST, OPTIONS',
              'Access-Control-Allow-Headers': 'Content-Type',
              'Access-Control-Max-Age': '86400',
              'Cache-Control': 'no-store',
              'Vary': 'Origin',
              'X-Content-Type-Options': 'nosniff'
            }
          }

          function jsonResponse(
            body: unknown,
            status: number,
            origin: string
          ): Response {
            return Response.json(body, {
              status,
              headers: corsHeaders(origin)
            })
          }

          function isValidCode(value: unknown): value is string {
            return typeof value === 'string' && value.length >= 10 && value.length <= 512
          }

          function isValidCodeVerifier(value: unknown): value is string {
            return (
              typeof value === 'string' &&
              value.length >= 43 &&
              value.length <= 128 &&
              /^[A-Za-z0-9._~-]+$/.test(value)
            )
          }

          export const onRequestOptions: PagesFunction<Env> = async ({ request, env }) => {
            const origin = getAllowedOrigin(request, env)
            if (!origin) {
              return new Response(null, { status: 403 })
            }
            return new Response(null, {
              status: 204,
              headers: corsHeaders(origin)
            })
          }

          export const onRequestPost: PagesFunction<Env> = async ({ request, env }) => {
            const origin = getAllowedOrigin(request, env)
            if (!origin) {
              return Response.json({ error: 'origin_not_allowed' }, { status: 403 })
            }

            if (
              !env.CLIENT_ID ||
              !env.CLIENT_SECRET ||
              !env.GITHUB_REDIRECT_URI
            ) {
              return jsonResponse({ error: 'server_not_configured' }, 503, origin)
            }

            if (!request.headers.get('Content-Type')?.includes('application/json')) {
              return jsonResponse({ error: 'content_type_must_be_json' }, 415, origin)
            }

            let payload: TokenRequestBody
            try {
              payload = await request.json<TokenRequestBody>()
            } catch {
              return jsonResponse({ error: 'invalid_json' }, 400, origin)
            }

            if (!isValidCode(payload.code)) {
              return jsonResponse({ error: 'invalid_code' }, 400, origin)
            }

            if (!isValidCodeVerifier(payload.codeVerifier)) {
              return jsonResponse({ error: 'invalid_code_verifier' }, 400, origin)
            }

            if (payload.redirectUri !== env.GITHUB_REDIRECT_URI) {
              return jsonResponse({ error: 'redirect_uri_mismatch' }, 400, origin)
            }

            const form = new URLSearchParams({
              client_id: env.CLIENT_ID,
              client_secret: env.CLIENT_SECRET,
              code: payload.code,
              redirect_uri: env.GITHUB_REDIRECT_URI,
              code_verifier: payload.codeVerifier
            })

            try {
              const githubResponse = await fetch(
                'https://github.com/login/oauth/access_token',
                {
                  method: 'POST',
                  headers: {
                    Accept: 'application/json',
                    'Content-Type': 'application/x-www-form-urlencoded'
                  },
                  body: form.toString()
                }
              )

              const tokenData = await githubResponse.json<GitHubTokenResponse>()
              if (!githubResponse.ok || !tokenData.access_token) {
                return jsonResponse(
                  {
                    error: tokenData.error || 'github_token_exchange_failed',
                    error_description: tokenData.error_description || undefined
                  },
                  400,
                  origin
                )
              }

              return jsonResponse(
                {
                  access_token: tokenData.access_token,
                  token_type: tokenData.token_type || 'bearer',
                  scope: tokenData.scope || ''
                },
                200,
                origin
              )
            } catch {
              return jsonResponse({ error: 'github_unavailable' }, 502, origin)
            }
          }
          ''')

          old_function = root / 'functions/api/getToken.ts'
          if old_function.exists():
              old_function.unlink()

          write('src/utils/oauth.ts', r'''
          const OAUTH_STATE_KEY = 'starhub-oauth-state'
          const OAUTH_CODE_VERIFIER_KEY = 'starhub-oauth-code-verifier'

          function randomBase64Url(byteLength: number): string {
            const bytes = crypto.getRandomValues(new Uint8Array(byteLength))
            const binary = Array.from(bytes, (byte) => String.fromCharCode(byte)).join('')
            return btoa(binary)
              .replace(/\+/g, '-')
              .replace(/\//g, '_')
              .replace(/=+$/g, '')
          }

          async function sha256Base64Url(value: string): Promise<string> {
            const digest = await crypto.subtle.digest(
              'SHA-256',
              new TextEncoder().encode(value)
            )
            const binary = Array.from(new Uint8Array(digest), (byte) =>
              String.fromCharCode(byte)
            ).join('')
            return btoa(binary)
              .replace(/\+/g, '-')
              .replace(/\//g, '_')
              .replace(/=+$/g, '')
          }

          export function getOAuthRedirectUri(): string {
            return new URL(import.meta.env.BASE_URL, window.location.origin).toString()
          }

          export async function createOAuthRequest(): Promise<{
            state: string
            codeVerifier: string
            codeChallenge: string
          }> {
            const state = randomBase64Url(32)
            const codeVerifier = randomBase64Url(64)
            const codeChallenge = await sha256Base64Url(codeVerifier)

            sessionStorage.setItem(OAUTH_STATE_KEY, state)
            sessionStorage.setItem(OAUTH_CODE_VERIFIER_KEY, codeVerifier)

            return { state, codeVerifier, codeChallenge }
          }

          export function consumeOAuthRequest(returnedState: string): string {
            const expectedState = sessionStorage.getItem(OAUTH_STATE_KEY)
            const codeVerifier = sessionStorage.getItem(OAUTH_CODE_VERIFIER_KEY)
            clearOAuthRequest()

            if (!expectedState || !codeVerifier || returnedState !== expectedState) {
              throw new Error('oauth_state_mismatch')
            }

            return codeVerifier
          }

          export function clearOAuthRequest(): void {
            sessionStorage.removeItem(OAUTH_STATE_KEY)
            sessionStorage.removeItem(OAUTH_CODE_VERIFIER_KEY)
          }
          ''')

          write('src/config/oauth.ts', r'''
          /**
           * GitHub OAuth public configuration.
           * Client ID may be exposed to the browser. Client Secret must only exist in
           * Cloudflare Pages Variables and Secrets.
           */

          const configuredApiBaseUrl = (import.meta.env.VITE_API_BASE_URL || '')
            .trim()
            .replace(/\/+$/, '')

          export const GITHUB_OAUTH_CONFIG = {
            CLIENT_ID:
              (import.meta.env.VITE_GITHUB_CLIENT_ID || '').trim() ||
              'Ov23liIm4iNdpnHwGLfp',
            API_BASE_URL:
              configuredApiBaseUrl || (import.meta.env.DEV ? '/api' : '')
          }
          ''')

          write('src/api/backend.ts', r'''
          import axios, { AxiosInstance } from 'axios'
          import { GITHUB_OAUTH_CONFIG } from '@/config/oauth'

          const backendHttp: AxiosInstance = axios.create({
            baseURL: GITHUB_OAUTH_CONFIG.API_BASE_URL || '/api',
            timeout: 30000,
            headers: {
              'Content-Type': 'application/json'
            }
          })

          export default backendHttp
          ''')

          write('src/api/auth.ts', r'''
          import backendHttp from './backend'
          import type { AxiosResponse } from 'axios'

          export interface OAuthTokenRequest {
            code: string
            codeVerifier: string
            redirectUri: string
          }

          export interface OAuthTokenResponse {
            token_type: string
            access_token: string
            scope: string
          }

          export const authApi = {
            getToken(
              payload: OAuthTokenRequest
            ): Promise<AxiosResponse<OAuthTokenResponse>> {
              return backendHttp.post('/oauth/token', payload)
            }
          }
          ''')

          write('src/utils/auth.ts', r'''
          const LEGACY_APP_TOKEN_KEY = 'app-token'
          const GITHUB_TOKEN_KEY = 'github-token'

          export const AuthToken = {
            getAppToken(): string | null {
              return this.getGithubToken()
            },

            getGithubToken(): string | null {
              return localStorage.getItem(GITHUB_TOKEN_KEY)
            },

            setGithubToken(githubToken: string): void {
              localStorage.removeItem(LEGACY_APP_TOKEN_KEY)
              localStorage.setItem(GITHUB_TOKEN_KEY, githubToken)
            },

            setToken(_appToken: string, githubToken: string): void {
              this.setGithubToken(githubToken)
            },

            clean(): void {
              localStorage.removeItem(LEGACY_APP_TOKEN_KEY)
              localStorage.removeItem(GITHUB_TOKEN_KEY)
            },

            exist(): boolean {
              return Boolean(this.getGithubToken())
            }
          }
          ''')

          login_path = root / 'src/pages/Login.vue'
          login = login_path.read_text(encoding='utf-8')
          login = login.replace(
              "import { GITHUB_OAUTH_CONFIG } from '@/config/oauth'",
              "import { GITHUB_OAUTH_CONFIG } from '@/config/oauth'\nimport {\n  clearOAuthRequest,\n  consumeOAuthRequest,\n  createOAuthRequest,\n  getOAuthRedirectUri\n} from '@/utils/oauth'"
          )

          callback_start = login.index('// 处理 OAuth 回调（当从 GitHub 重定向回来时）')
          callback_end = login.index('// 登录处理函数', callback_start)
          callback_block = r'''// 处理 OAuth 回调（GitHub 回到应用根路径并附带 code/state）
          onMounted(async () => {
            const query = qs.parse(location.search)
            const code = typeof query.code === 'string' ? query.code : ''
            const returnedState = typeof query.state === 'string' ? query.state : ''

            if (!code) {
              return
            }

            if (
              window.opener &&
              typeof (window.opener as Window & {
                oauthGetCodeCb?: (oauthCode: string, state: string) => void
              }).oauthGetCodeCb === 'function'
            ) {
              ;(window.opener as Window & {
                oauthGetCodeCb: (oauthCode: string, state: string) => void
              }).oauthGetCodeCb(code, returnedState)
              window.close()
              return
            }

            try {
              const codeVerifier = consumeOAuthRequest(returnedState)
              window.history.replaceState(
                {},
                document.title,
                `${location.pathname}#/login`
              )
              await login(code, codeVerifier)
            } catch {
              clearOAuthRequest()
              error.value = 'OAuth 状态校验失败，请重新发起登录。'
              loading.value = false
            }
          })

          '''
          login = login[:callback_start] + callback_block + login[callback_end:]
          login = login.replace(
              'const login = async (code: string) => {',
              'const login = async (code: string, codeVerifier: string) => {'
          )
          login = login.replace(
              'const res = await authApi.getToken(code)',
              "const res = await authApi.getToken({\n      code,\n      codeVerifier,\n      redirectUri: getOAuthRedirectUri()\n    })"
          )
          login = login.replace(
              'const { token, token_type, access_token } = res.data',
              'const { token_type, access_token } = res.data'
          )
          login = login.replace(
              'AuthToken.setToken(token, ghToken)',
              'AuthToken.setGithubToken(ghToken)'
          )
          login = login.replace('Cloudflare Workers', 'Cloudflare Pages Functions')

          handle_start = login.index('const handleLogin = () => {')
          handle_end = login.index('const handleLanguageChange', handle_start)
          handle_block = r'''const handleLogin = async () => {
            loading.value = true
            error.value = ''

            const clientId = GITHUB_OAUTH_CONFIG.CLIENT_ID
            if (!clientId) {
              error.value = t('login.configError')
              loading.value = false
              return
            }

            if (import.meta.env.PROD && !GITHUB_OAUTH_CONFIG.API_BASE_URL) {
              error.value = 'OAuth 后端尚未配置。请先设置 GitHub Actions 变量 VITE_API_BASE_URL。'
              loading.value = false
              return
            }

            try {
              const { state, codeChallenge } = await createOAuthRequest()
              const params = {
                client_id: clientId,
                redirect_uri: getOAuthRedirectUri(),
                state,
                code_challenge: codeChallenge,
                code_challenge_method: 'S256',
                scope: 'read:user'
              }
              const url =
                'https://github.com/login/oauth/authorize?' + qs.stringify(params)
              const authWindow = openWindowCenter(url, 'authWindow', 600, 700)

              if (!authWindow) {
                clearOAuthRequest()
                error.value = '浏览器阻止了登录窗口，请允许弹出窗口后重试。'
                loading.value = false
                return
              }

              ;(window as Window & {
                oauthGetCodeCb?: (oauthCode: string, returnedState: string) => void
              }).oauthGetCodeCb = async (oauthCode, returnedState) => {
                authWindow.close()
                delete (window as Window & { oauthGetCodeCb?: unknown }).oauthGetCodeCb

                try {
                  const codeVerifier = consumeOAuthRequest(returnedState)
                  await login(oauthCode, codeVerifier)
                } catch {
                  clearOAuthRequest()
                  error.value = 'OAuth 状态校验失败，请重新发起登录。'
                  loading.value = false
                }
              }
            } catch {
              clearOAuthRequest()
              error.value = '无法初始化安全登录，请刷新页面后重试。'
              loading.value = false
            }
          }

          '''
          login = login[:handle_start] + handle_block + login[handle_end:]
          login_path.write_text(login, encoding='utf-8')

          vite_path = root / 'vite.config.ts'
          vite = vite_path.read_text(encoding='utf-8')
          vite = re.sub(
              r"\n\s*transformed = transformed\.replace\(\n\s*/location\\\.origin.*?\n\s*\)\n",
              '\n',
              vite,
              flags=re.S
          )
          vite_path.write_text(vite, encoding='utf-8')

          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace(
              '      - name: Build application and documentation\n        run: npm run pages:build\n',
              '      - name: Type-check Cloudflare Functions\n        run: npm run cloudflare:type-check\n\n'
              '      - name: Build application and documentation\n        run: npm run pages:build\n\n'
              '      - name: Build Cloudflare Pages bundle\n        run: npm run cloudflare:build\n'
          )
          ci_path.write_text(ci, encoding='utf-8')

          deploy_path = root / '.github/workflows/deploy-pages.yml'
          deploy = deploy_path.read_text(encoding='utf-8')
          expression_api = '$' + '{{ vars.VITE_API_BASE_URL }}'
          expression_client = '$' + '{{ vars.VITE_GITHUB_CLIENT_ID }}'
          deploy = deploy.replace(
              '      - name: Build application and documentation\n        run: npm run pages:build\n',
              '      - name: Build application and documentation\n'
              '        env:\n'
              f'          VITE_API_BASE_URL: {expression_api}\n'
              f'          VITE_GITHUB_CLIENT_ID: {expression_client}\n'
              '        run: npm run pages:build\n'
          )
          deploy_path.write_text(deploy, encoding='utf-8')

          gitignore_path = root / '.gitignore'
          gitignore = gitignore_path.read_text(encoding='utf-8')
          additions = '\n# Cloudflare Pages Functions\ncloudflare-dist\n.dev.vars*\n!.dev.vars.example\n'
          if 'cloudflare-dist' not in gitignore:
              gitignore += additions
          gitignore_path.write_text(gitignore, encoding='utf-8')

          write('.dev.vars.example', r'''
          CLIENT_ID=Ov23liIm4iNdpnHwGLfp
          CLIENT_SECRET=replace_with_your_github_oauth_client_secret
          ALLOWED_ORIGINS=http://localhost:5173,https://hujinghaoabcd.github.io
          GITHUB_REDIRECT_URI=http://localhost:5173/
          ''')

          write('docs/deploy/cloudflare.md', r'''
          # Cloudflare Pages Functions OAuth 后端

          StarHub 正式前端继续部署在 GitHub Pages：

          - 应用：`https://hujinghaoabcd.github.io/StarHub/`
          - 文档：`https://hujinghaoabcd.github.io/StarHub/docs/`

          Cloudflare Pages 项目只承载 OAuth API，不重复承担正式前端托管。

          ## 1. 创建 Cloudflare Pages 项目

          进入 Cloudflare Dashboard：

          `Workers & Pages → Create → Pages → Connect to Git`

          连接 GitHub 并选择 `hujinghaoabcd/StarHub`，使用以下构建设置：

          | 设置 | 值 |
          |---|---|
          | Production branch | `main` |
          | Build command | `npm run cloudflare:build` |
          | Build output directory | `cloudflare-dist` |
          | Root directory | `/` |
          | Node.js | `22` |

          `/functions` 必须位于仓库根目录。Cloudflare 会根据文件路径生成 API 路由：

          - `functions/api/health.ts` → `/api/health`
          - `functions/api/oauth/token.ts` → `/api/oauth/token`

          ## 2. 配置 Variables and Secrets

          进入：

          `Workers & Pages → StarHub OAuth 项目 → Settings → Variables and Secrets`

          在 Production 环境添加：

          | 名称 | 值 | 类型 |
          |---|---|---|
          | `CLIENT_ID` | `Ov23liIm4iNdpnHwGLfp` | Text |
          | `CLIENT_SECRET` | GitHub OAuth App Client Secret | **Encrypt** |
          | `ALLOWED_ORIGINS` | `https://hujinghaoabcd.github.io` | Text |
          | `GITHUB_REDIRECT_URI` | `https://hujinghaoabcd.github.io/StarHub/` | Text |

          Secret 不得提交到仓库或粘贴到 issue、日志和聊天记录。

          保存变量后重新部署 Production。

          ## 3. 配置 GitHub OAuth App

          GitHub 中进入：

          `Settings → Developer settings → OAuth Apps → StarHub`

          设置：

          ```text
          Homepage URL:
          https://hujinghaoabcd.github.io/StarHub/

          Authorization callback URL:
          https://hujinghaoabcd.github.io/StarHub/
          ```

          回调地址不再使用 `#/login`。授权 code 和 state 会作为查询参数返回到应用根路径。

          ## 4. 将 Cloudflare API 地址提供给 GitHub Pages

          Cloudflare 首次部署完成后会生成类似地址：

          ```text
          https://starhub-oauth.pages.dev
          ```

          在 GitHub 仓库进入：

          `Settings → Secrets and variables → Actions → Variables`

          添加：

          ```text
          VITE_API_BASE_URL=https://你的项目.pages.dev/api
          VITE_GITHUB_CLIENT_ID=Ov23liIm4iNdpnHwGLfp
          ```

          然后重新运行 `Deploy GitHub Pages`，或者向 `main` 推送新提交。

          ## 5. 验证

          先访问：

          ```text
          https://你的项目.pages.dev/api/health
          ```

          正确配置后应返回：

          ```json
          {
            "status": "ok",
            "service": "starhub-oauth",
            "configured": true
          }
          ```

          再打开 StarHub，点击“使用 GitHub 登录”，完成授权和仓库同步。

          ## 6. 本地开发

          复制示例变量：

          ```bash
          cp .dev.vars.example .dev.vars
          ```

          将 `.dev.vars` 中的 `CLIENT_SECRET` 改为本地开发 OAuth App 的密钥，然后运行：

          ```bash
          npm run cloudflare:dev
          ```

          Cloudflare Pages Functions 默认在 `http://localhost:8788` 启动。前端仍可通过现有本地代理或设置 `VITE_API_BASE_URL` 指向该地址进行联调。

          ## 安全措施

          当前实现包括：

          - OAuth `state` 校验；
          - PKCE S256；
          - code 通过 JSON POST 发送；
          - GitHub token 交换使用 POST 请求体；
          - 严格 Origin 白名单和 CORS 预检；
          - redirect URI 精确校验；
          - 响应禁止缓存；
          - Client Secret 仅存在于 Cloudflare 加密 Secret；
          - 不生成伪造的随机应用 token。
          ''')

          write('docs/guide/oauth.md', r'''
          # GitHub OAuth 配置

          StarHub 使用 GitHub OAuth Web Flow。静态前端运行在 GitHub Pages，授权 code 由 Cloudflare Pages Function 在服务端兑换为访问令牌。

          ## 生产地址

          ```text
          Homepage URL:
          https://hujinghaoabcd.github.io/StarHub/

          Authorization callback URL:
          https://hujinghaoabcd.github.io/StarHub/
          ```

          回调地址必须包含 `/StarHub/`，并且不能使用 `#/login`。

          ## 安全流程

          1. 浏览器生成随机 `state` 与 PKCE `code_verifier`；
          2. 浏览器将 `code_challenge` 发给 GitHub；
          3. GitHub 将 `code` 和 `state` 返回 StarHub 根路径；
          4. StarHub 校验 `state`；
          5. StarHub 使用 POST 将 `code`、`code_verifier` 和回调地址发送给 Cloudflare；
          6. Cloudflare 使用加密保存的 Client Secret 向 GitHub 交换 token；
          7. 前端验证当前 GitHub 用户并进入应用。

          ## 本地开发

          本地环境应使用单独的 GitHub OAuth App：

          ```text
          Homepage URL: http://localhost:5173/
          Authorization callback URL: http://localhost:5173/
          ```

          本地 Function 变量放在未提交的 `.dev.vars` 中，可从 `.dev.vars.example` 复制。

          ## 必需配置

