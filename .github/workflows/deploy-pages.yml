name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - agent/foundation-ci-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run pages:build

      - name: Inspect GitHub Pages configuration
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{status: .status, html_url: .html_url, build_type: .build_type, source: .source}'; then
            echo "GitHub Pages is enabled for this repository."
          else
            echo "::warning::GitHub Pages is not enabled yet, or this workflow token cannot read the Pages configuration."
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify deployed Pages site
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Smoke test application and documentation
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail

          base_url="${PAGE_URL%/}"
          curl_args=(
            --fail
            --silent
            --show-error
            --location
            --retry 12
            --retry-all-errors
            --retry-delay 5
          )

          curl "${curl_args[@]}" "${base_url}/" --output application.html
          curl "${curl_args[@]}" "${base_url}/docs/" --output documentation.html
          curl "${curl_args[@]}" "${base_url}/deployment-info.json" --output deployment-info.json

          grep -q '<div id="app"></div>' application.html
          grep -Eq '/StarHub/assets/[^"[:space:]]+\.(js|css)' application.html
          grep -q 'StarHub' documentation.html
          grep -q '/StarHub/docs/assets/' documentation.html
          jq -e '.appBase == "/StarHub/" and .docsBase == "/StarHub/docs/"' deployment-info.json

          application_asset="$(grep -oE '/StarHub/assets/[^"[:space:]]+\.(js|css)' application.html | head -n 1)"
          documentation_asset="$(grep -oE '/StarHub/docs/assets/[^"[:space:]]+\.(js|css)' documentation.html | head -n 1)"

          test -n "${application_asset}"
          test -n "${documentation_asset}"

          curl "${curl_args[@]}" "${base_url}${application_asset#/StarHub}" --output /dev/null
          curl "${curl_args[@]}" "${base_url}${documentation_asset#/StarHub}" --output /dev/null

          echo "Application URL: ${base_url}/"
          echo "Documentation URL: ${base_url}/docs/"
          echo "Application asset: ${application_asset}"
          echo "Documentation asset: ${documentation_asset}"
          echo "GitHub Pages smoke test passed."

  report:
    name: Report Pages status
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - build
      - deploy
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Update pull request deployment comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          pr_number="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f head="${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" \
              --jq '.[0].number // empty'
          )"

          if [[ -z "${pr_number}" ]]; then
            echo "No open pull request found for ${HEAD_BRANCH}; skipping report."
            exit 0
          fi

          marker='<!-- starhub-pages-deployment -->'
          if [[ "${BUILD_RESULT}" == "success" && "${DEPLOY_RESULT}" == "success" && "${VERIFY_RESULT}" == "success" ]]; then
            summary='✅ GitHub Pages 部署与公网冒烟测试成功'
            application_url="${PAGE_URL}"
            documentation_url="${PAGE_URL%/}/docs/"
          elif [[ "${BUILD_RESULT}" != "success" ]]; then
            summary='❌ GitHub Pages 构建失败'
            application_url='尚未生成'
            documentation_url='尚未生成'
          elif [[ "${DEPLOY_RESULT}" != "success" ]]; then
            summary='❌ GitHub Pages 发布失败或被跳过'
            application_url='尚不可访问'
            documentation_url='尚不可访问'
          else
            summary='⚠️ GitHub Pages 已发布，但公网冒烟测试失败'
            application_url="${PAGE_URL}"
            documentation_url="${PAGE_URL%/}/docs/"
          fi

          body="${marker}
          ## 在线部署状态

          ${summary}

          - 应用预览：${application_url}
          - 项目文档：${documentation_url}
          - 构建结果：\`${BUILD_RESULT}\`
          - 发布结果：\`${DEPLOY_RESULT}\`
          - 公网验证：\`${VERIFY_RESULT}\`
          - 分支：\`${HEAD_BRANCH}\`
          - 提交：\`${GITHUB_SHA}\`

          > 登录仍依赖待部署的 OAuth 后端；当前 Pages 主要用于界面和文档预览。"

          payload_file="$(mktemp)"
          jq -n --arg body "${body}" '{ body: $body }' > "${payload_file}"

          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "${payload_file}" >/dev/null
            echo "Updated Pages deployment comment ${comment_id}."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
              --input "${payload_file}" >/dev/null
            echo "Created Pages deployment comment."
          fi
