name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - agent/foundation-ci-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application and documentation
        run: npm run pages:build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Report Pages status
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Update pull request status comment
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          pr_number="${EVENT_PR_NUMBER}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f head="${GITHUB_REPOSITORY_OWNER}:${HEAD_BRANCH}" \
                --jq '.[0].number // empty'
            )"
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "No open pull request found for ${HEAD_BRANCH}; skipping report."
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            marker='<!-- starhub-pages-validation -->'
            if [[ "${BUILD_RESULT}" == "success" ]]; then
              summary='✅ GitHub Pages 组合产物验证成功'
            else
              summary='❌ GitHub Pages 组合产物验证失败'
            fi

            body="${marker}
          ## Pages 构建验证

          ${summary}

          - 应用目标路径：\`/StarHub/\`
          - 文档目标路径：\`/StarHub/docs/\`
          - 构建结果：\`${BUILD_RESULT}\`
          - 分支：\`${HEAD_BRANCH}\`
          - 提交：\`${GITHUB_SHA}\`

          > PR 事件只验证组合产物，不执行生产发布。真正的在线地址由同一提交的 push 工作流发布。"
          else
            marker='<!-- starhub-pages-deployment -->'
            if [[ "${BUILD_RESULT}" == "success" && "${DEPLOY_RESULT}" == "success" ]]; then
              summary='✅ GitHub Pages 部署成功'
              application_url="${PAGE_URL}"
              documentation_url="${PAGE_URL%/}/docs/"
            elif [[ "${BUILD_RESULT}" != "success" ]]; then
              summary='❌ GitHub Pages 构建失败'
              application_url='尚未生成'
              documentation_url='尚未生成'
            else
              summary='⚠️ 构建成功，但 GitHub Pages 发布失败或被跳过'
              application_url='尚不可访问'
              documentation_url='尚不可访问'
            fi

            body="${marker}
          ## 在线部署状态

          ${summary}

          - 应用预览：${application_url}
          - 项目文档：${documentation_url}
          - 构建结果：\`${BUILD_RESULT}\`
          - 发布结果：\`${DEPLOY_RESULT}\`
          - 分支：\`${HEAD_BRANCH}\`
          - 提交：\`${GITHUB_SHA}\`

          > 登录仍依赖待部署的 OAuth 后端；当前 Pages 主要用于界面和文档预览。"
          fi

          payload_file="$(mktemp)"
          jq -n --arg body "${body}" '{ body: $body }' > "${payload_file}"

          comment_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1
          )"

          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "${payload_file}" >/dev/null
            echo "Updated Pages status comment ${comment_id}."
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
              --input "${payload_file}" >/dev/null
            echo "Created Pages status comment."
          fi
