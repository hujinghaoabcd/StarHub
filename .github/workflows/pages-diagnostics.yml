name: Diagnose GitHub Pages

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write

jobs:
  inspect:
    name: Inspect Pages workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect Pages configuration and related runs
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Pages configuration:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{html_url: .html_url, build_type: .build_type, source: .source, status: .status}'

          echo "Workflow runs for ${HEAD_SHA}:"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=30" \
            --jq '.workflow_runs[] | {id, name, event, status, conclusion, head_branch, head_sha, html_url, created_at, updated_at}'
