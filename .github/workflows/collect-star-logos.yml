name: Collect starred project logos

on:
  push:
    branches:
      - logo-collector-20260805
    paths:
      - .github/workflows/collect-star-logos.yml
      - tools/collect_star_logos.py

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out collector branch
        uses: actions/checkout@v4
        with:
          ref: logo-collector-20260805

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check aiohttp pillow

      - name: Collect, normalize, deduplicate, and package logos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAR_USER: hujinghaoabcd
          CONCURRENCY: '56'
          AVATAR_SIZE: '192'
          OUT_DIR: star-project-logos
          ZIP_PATH: star-project-logos-20260805.zip
        run: python tools/collect_star_logos.py

      - name: Upload flat logo ZIP
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: star-project-logos-20260805
          path: star-project-logos-20260805.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish run locator on temporary branch
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          payload = {
              "run_id": int(os.environ["RUN_ID"]),
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "artifact_url": os.environ.get("ARTIFACT_URL", ""),
              "artifact_name": "star-project-logos-20260805",
              "completed_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          pathlib.Path("collector-run.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-run.json
          git commit -m "chore: record temporary logo artifact run"
          git push origin HEAD:logo-collector-20260805
