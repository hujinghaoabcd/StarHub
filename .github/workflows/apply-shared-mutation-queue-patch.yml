name: Apply shared mutation queue patch

on:
  push:
    branches:
      - agent/tag-relations-single-source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-mutation-queue-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tag-relations-single-source
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply repository store patch
        run: node scripts/apply-shared-mutation-queue-patch.mjs

      - name: Commit generated repository store changes
        run: |
          if git diff --quiet -- src/stores/repo.ts; then
            echo "No repository store changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/stores/repo.ts
          git commit -m "fix: serialize repository and relation mutations"
          git push origin HEAD:agent/tag-relations-single-source
