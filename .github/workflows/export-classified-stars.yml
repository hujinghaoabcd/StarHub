name: Export classified GitHub stars

on:
  push:
    branches:
      - chatgpt-stars-export-20260727
    paths:
      - .github/workflows/export-classified-stars.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-classified-stars.yml
      - scripts/export_classified_stars_fast.py

permissions:
  contents: read

jobs:
  export-stars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and classify every public starred repository
        env:
          STAR_USER: hujinghaoabcd
          STAR_OUTPUT: exports/github-stars-classified-hujinghaoabcd.md
        run: python -u scripts/export_classified_stars_fast.py

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-stars-classified-hujinghaoabcd
          path: exports/github-stars-classified-hujinghaoabcd.md
          if-no-files-found: error
          retention-days: 7
