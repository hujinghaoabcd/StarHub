name: Apply auth expiry message patch

on:
  push:
    branches:
      - agent/session-auth-lifecycle
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auth-expiry-message-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/session-auth-lifecycle
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply Login message patch
        run: node scripts/apply-auth-expiry-message-patch.mjs

      - name: Commit generated Login changes
        run: |
          if git diff --quiet -- src/pages/Login.vue; then
            echo "No Login changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Login.vue
          git commit -m "feat: explain expired authentication sessions"
          git push origin HEAD:agent/session-auth-lifecycle
