name: Apply repository controls migration

on:
  push:
    branches:
      - agent/repo-links-unstar-pagination
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-repository-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/repo-links-unstar-pagination
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply repository controls migration
        run: node scripts/apply-repository-controls.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full verification
        run: npm run check

      - name: Remove one-time migration files
        run: |
          rm scripts/apply-repository-controls.mjs
          rm .github/workflows/apply-repository-controls.yml

      - name: Commit migrated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add repository links, global sorting, and unstar"
          git push origin HEAD:agent/repo-links-unstar-pagination
